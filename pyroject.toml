[tool.pytest.ini_options]
asyncio_mode = 'auto'
pythonpath = '.'
norecursedirs = 'env/*'
addopts = '-vv -p no:cacheprovider --disable-warnings'
testpaths = ['tests/']
python_files = 'test_*.py'
env_files = [
    'tests/.env.test'
]
env_files_skip_if_set = true

[tool.ruff]
select = ["E", "F", "W", "PT", "DJ", "D"]
ignore = ["E501", "E265", "F811", "PT001", "DJ05", "D100", "D104", "D105", "W504", "W292"]
line-length = 119
src = ["app"]
exclude = ["tests", "alembic", "venv", "env", ".git", "__pycache__"]

[tool.ruff.mccabe]
max-complexity = 10